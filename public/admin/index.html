<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Shine On Cosmetics</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>"
    />
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <!-- Sidebar -->
      <aside class="admin-sidebar">
        <div class="sidebar-header">
          <a href="/" class="logo">SHINE ON</a>
          <span>Admin</span>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-item active" data-tab="overview">
            <span class="icon">📊</span> Overview
          </button>
          <button class="nav-item" data-tab="products">
            <span class="icon">💄</span> Products
          </button>
          <button class="nav-item" data-tab="categories">
            <span class="icon">🏷️</span> Categories
          </button>
          <button class="nav-item" data-tab="orders">
            <span class="icon">🛍️</span> Orders
          </button>
          <button class="nav-item" data-tab="settings">
            <span class="icon">⚙️</span> Settings
          </button>
        </nav>
        <div class="sidebar-footer">
          <button id="adminLogout" class="btn btn-outline btn-full">
            Logout
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="admin-main">
        <header class="admin-header">
          <h1 id="pageTitle">Overview</h1>
          <div class="header-right">
            <div class="status-toggle">
              <span>Accepting Orders</span>
              <div class="toggle-switch active" id="orderToggle"></div>
            </div>
            <div class="admin-profile">
              <span id="adminName">Admin</span>
              <div class="admin-avatar">✨</div>
            </div>
          </div>
        </header>

        <section id="adminContent" class="admin-content">
          <!-- Dynamic Content Injected Here -->
          <div class="dashboard-stats">
            <div class="stat-card">
              <span class="stat-label">Total Orders</span>
              <p class="stat-value" id="totalOrders">0</p>
            </div>
            <div class="stat-card">
              <span class="stat-label">Expected Revenue</span>
              <p class="stat-value" id="expectedRevenue">$0.00</p>
            </div>
            <div class="stat-card">
              <span class="stat-label">Paid Revenue</span>
              <p class="stat-value" id="paidRevenue">$0.00</p>
            </div>
            <div class="stat-card">
              <span class="stat-label">Active Products</span>
              <p class="stat-value" id="activeProducts">0</p>
            </div>
          </div>

          <div class="recent-activity">
            <h2>Recent Orders</h2>
            <div class="table-wrapper">
              <div class="table-responsive">
                <table id="recentOrdersTable">
                  <thead>
                    <tr>
                      <th>Order ID</th>
                      <th>Customer</th>
                      <th>Amount</th>
                      <th>Status</th>
                      <th>Date</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Injected via JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Modals -->
    <div id="productModal" class="modal">
      <div class="modal-content">
        <h2 id="modalTitle">Add New Product</h2>
        <form id="productForm" class="auth-form">
          <div class="form-group">
            <label>Product Name</label>
            <input
              type="text"
              id="prodName"
              placeholder="e.g. Silk Glow Serum"
              required
            />
          </div>
          <div
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem"
          >
            <div class="form-group">
              <label>Category</label>
              <select id="prodCategory" required>
                <!-- Injected -->
              </select>
            </div>
            <div class="form-group">
              <label>Price ($)</label>
              <input
                type="number"
                id="prodPrice"
                step="0.01"
                value="25.00"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Thumbnail URL</label>
            <input type="text" id="prodImage" placeholder="https://..." />
          </div>
          <div style="display: flex; gap: 1rem; margin-top: 2rem">
            <button
              type="button"
              class="btn btn-outline btn-full"
              onclick="window.closeModal()"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary btn-full">
              Save Product
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="/js/components/navbar.js"></script>
    <!-- To keep logic for auth if needed -->
    <script type="module" src="/admin/admin-logic.js"></script>
  </body>
</html>
