<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your shopping cart - Review your selections"
    />
    <title>Your Cart | Shine On</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pages-common.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>"
    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <main class="container cart-page">
      <h1 class="cart-title">The Ritual Selection</h1>

      <div class="cart-layout" id="cartLayout">
        <section class="cart-card" id="cartItems">
          <!-- Items injected via JS -->
        </section>

        <aside class="cart-summary-box" id="cartSummary">
          <!-- Summary injected via JS -->
        </aside>
      </div>

      <div class="empty-cart" id="emptyCart" style="display: none">
        <div class="empty-cart-content">
          <span style="font-size: 5rem; display: block; margin-bottom: 1.5rem"
            >🛍️</span
          >
          <h2>Your cart is empty</h2>
          <p>Discover our collection of editorial beauty essentials</p>
          <a href="/shop" class="btn btn-primary">Start Shopping</a>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/footer.js"></script>
    <script type="module" src="../js/cart-logic.js"></script>
  </body>
</html>
