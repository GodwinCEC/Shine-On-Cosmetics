<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your personal dashboard" />
    <title>Dashboard | Shine On</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pages-common.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>"
    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <main class="container dashboard-page">
      <header class="dashboard-header">
        <span class="section-tag">Your Sanctuary</span>
        <h1 id="welcomeMessage">Welcome Back</h1>

        <div class="dashboard-tabs">
          <span class="tab-link active" data-tab="favorites">Favorites</span>
          <span class="tab-link" data-tab="orders">Orders</span>
          <span class="tab-link" data-tab="settings">Settings</span>
        </div>
      </header>

      <section id="favoritesTab" class="dashboard-content">
        <div class="product-grid" id="wishlistGrid">
          <!-- Favorites injected -->
        </div>
        <div
          class="empty-state"
          id="emptyWishlist"
          style="display: none; text-align: center; padding: 4rem 2rem"
        >
          <h3 style="font-size: 2rem; margin-bottom: 1rem">No favorites yet</h3>
          <p style="color: var(--text-secondary); margin-bottom: 2rem">
            Start building your wishlist
          </p>
          <a href="/shop" class="btn btn-primary">Browse Products</a>
        </div>
      </section>

      <section id="ordersTab" class="dashboard-content" style="display: none">
        <div style="text-align: center; padding: 4rem 2rem">
          <h3 style="font-size: 2rem; margin-bottom: 1rem">No orders yet</h3>
          <p style="color: var(--text-secondary); margin-bottom: 2rem">
            When you place orders, they'll appear here
          </p>
          <a href="/shop" class="btn btn-primary">Start Shopping</a>
        </div>
      </section>

      <section id="settingsTab" class="dashboard-content" style="display: none">
        <div
          class="settings-card"
          style="
            background: var(--color-white);
            padding: 3rem;
            border-radius: var(--radius-xl);
            max-width: 600px;
            margin: 0 auto;
          "
        >
          <h2 style="margin-bottom: 2rem">Account Settings</h2>
          <div style="margin-bottom: 2rem">
            <p
              style="
                font-size: 0.9rem;
                color: var(--text-secondary);
                margin-bottom: 1rem;
              "
            >
              Email: <strong id="userEmail">user@shineon.com</strong>
            </p>
            <p style="font-size: 0.9rem; color: var(--text-secondary)">
              Member since: <strong id="memberSince">Today</strong>
            </p>
          </div>
          <button class="btn btn-outline btn-full" id="logoutBtn">
            Sign Out
          </button>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/footer.js"></script>
    <script type="module">
      import { products } from "../js/products-data.js";

      // Check if user is logged in
      const user = JSON.parse(localStorage.getItem("user") || "null");
      if (!user) {
        window.location.href = "/auth";
      }

      // Update welcome message
      document.getElementById("welcomeMessage").textContent =
        `Welcome Back, ${user.name}`;
      document.getElementById("userEmail").textContent = user.email;
      document.getElementById("memberSince").textContent = new Date(
        user.loggedInAt,
      ).toLocaleDateString();

      // Load wishlist
      function loadWishlist() {
        const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
        const grid = document.getElementById("wishlistGrid");
        const emptyState = document.getElementById("emptyWishlist");

        if (wishlist.length === 0) {
          grid.style.display = "none";
          emptyState.style.display = "block";
          return;
        }

        grid.style.display = "grid";
        emptyState.style.display = "none";

        grid.innerHTML = wishlist
          .map(
            (product, index) => `
          <div class="product-card" style="animation-delay: ${index * 0.1}s" onclick="location.href='/product?id=${product.id}'">
            <div class="card-img">
              <img src="${product.image}" alt="${product.name}" loading="lazy">
            </div>
            <div class="product-info-minimal">
              <span class="category-tag">${product.category}</span>
              <h3>${product.name}</h3>
              <p class="price">$${product.price}</p>
            </div>
          </div>
        `,
          )
          .join("");
      }

      // Tab switching
      document.querySelectorAll(".tab-link").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab-link")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");

          document.querySelectorAll(".dashboard-content").forEach((content) => {
            content.style.display = "none";
          });

          const tabName = tab.dataset.tab;
          document.getElementById(`${tabName}Tab`).style.display = "block";
        });
      });

      // Logout
      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("user");
        window.location.href = "/auth";
      });

      // Initialize
      loadWishlist();
    </script>
  </body>
</html>
