<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Shine On Cosmetics</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pages-common.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>"
    />
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <main class="container checkout-page">
      <h1 class="cart-title fade-in">Finalize Your Ritual</h1>

      <div class="cart-layout">
        <form id="checkoutForm" class="checkout-form-section fade-in">
          <div class="cart-card">
            <h2 style="margin-bottom: 2rem">Shipping Information</h2>

            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="form-group">
              <label for="address">Shipping Address</label>
              <input
                type="text"
                id="address"
                name="address"
                placeholder="Street name, house number, apartment"
                required
              />
            </div>

            <div
              class="form-row"
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem"
            >
              <div class="form-group">
                <label for="city">City / Region</label>
                <input
                  type="text"
                  id="city"
                  name="city"
                  placeholder="City"
                  required
                />
              </div>
              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Phone"
                  required
                />
              </div>
            </div>

            <h2 style="margin: 3rem 0 2rem">Payment Method</h2>
            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="payment" value="paystack" checked />
                <div class="option-content">
                  <span class="option-title">Card / MOMO</span>
                  <p>Pay securely via Paystack</p>
                </div>
              </label>

              <label class="payment-option">
                <input type="radio" name="payment" value="cod" />
                <div class="option-content">
                  <span class="option-title">Cash on Delivery</span>
                  <p>Pay when your order arrives</p>
                </div>
              </label>
            </div>

            <p class="terms-notice">
              By placing this order, you agree to our Terms of Service and
              Privacy Policy.
            </p>
          </div>
        </form>

        <aside class="cart-summary-box fade-in" id="orderSummary">
          <!-- Summary injected via JS -->
          <div class="summary-loading">
            <div class="loading"></div>
            <p>Preparing your summary...</p>
          </div>
        </aside>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/footer.js"></script>
    <script type="module" src="../js/payment.js"></script>
  </body>
</html>
