<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your shopping cart - Review your selections"
    />
    <title>Cart - Shine On Cosmetics</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages-common.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>"
    />
    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div
      id="navbar-placeholder"
      data-hide-on-scroll="true"
      data-active="cart"
    ></div>

    <main class="container cart-page">
      <!-- <h1 class="cart-title">The Product Selection</h1> -->

      <div class="cart-layout" id="cartLayout">
        <section class="cart-card" id="cartItems">
          <!-- Items injected via JS -->
        </section>

        <aside class="cart-summary-box" id="cartSummary">
          <!-- Summary injected via JS -->
        </aside>
      </div>

      <div class="empty-cart" id="emptyCart" style="display: none">
        <div class="empty-cart-content">
          <span style="font-size: 5rem; display: block; margin-bottom: 1.5rem"
            >🛒</span
          >
          <h2>Your cart is empty</h2>
          <p>Discover our collection of editorial beauty essentials</p>
          <a href="shop.html" class="btn btn-primary">Start Shopping</a>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js?v=0.1.4"></script>
    <script type="module" src="js/cart-logic.js"></script>
  </body>
</html>
